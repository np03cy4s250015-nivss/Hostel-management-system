<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System - Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your username and registered email to receive an OTP</p>
            </div>

            <form id="forgotPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="Enter your registered email" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">Send OTP</button>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="error-message" style="display: none; background-color: #F0FDF4; border-color: #BBF7D0; color: #166534;"></div>
            </form>

            <div class="login-footer">
                <p><a href="../index.html" style="color: var(--primary-color); font-weight: 500;">&larr; Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = (window._env_ && window._env_.API_BASE_URL) || 'http://127.0.0.1:3000/api/auth';

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('forgotPasswordForm');
            form.addEventListener('submit', handleForgotPassword);
        });

        async function handleForgotPassword(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            const btn = document.querySelector('.login-btn');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!username || !email) {
                showError('Please fill in all fields');
                return;
            }


            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE_URL}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Failed to send OTP');
                    return;
                }

                sessionStorage.setItem('resetUserId', data.userId);

                successMsg.textContent = data.message || 'OTP sent! Check the Windows notification for your code.';
                successMsg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'otp_verification.html';
                }, 2000);
            } catch (error) {
                console.error('Forgot password error:', error);
                showError('Unable to connect to server. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
            }
        }



        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'none';
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>
